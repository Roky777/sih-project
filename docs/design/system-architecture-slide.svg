<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title description">
  <title id="title">AeroCare system architecture</title>
  <desc id="description">A presentation-ready architecture diagram showing imported evidence, the React workspace, FastAPI, decision engines, durable jobs, storage, and human approval.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#12365d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 11 6 1 11Z" fill="#2d6597"/>
    </marker>
    <style>
      .title{font:700 31px Inter,Arial,sans-serif;fill:#fff;letter-spacing:.8px}
      .section{font:700 22px Inter,Arial,sans-serif;fill:#153e69}
      .body{font:500 16px Inter,Arial,sans-serif;fill:#395a78}
      .small{font:500 14px Inter,Arial,sans-serif;fill:#62788d}
      .cardTitle{font:700 18px Inter,Arial,sans-serif;fill:#153e69}
      .cardBody{font:500 14px Inter,Arial,sans-serif;fill:#46647f}
      .chip{font:700 13px Inter,Arial,sans-serif;fill:#fff;letter-spacing:.25px}
      .line{fill:none;stroke:#2d6597;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="1118" rx="28" fill="#f8fafc" stroke="#b7c5d1" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="82" rx="28" fill="#123f68"/>
  <path d="M1 55H899V83H1Z" fill="#123f68"/>
  <text x="450" y="52" text-anchor="middle" class="title">SYSTEM ARCHITECTURE</text>

  <!-- Evidence inputs -->
  <g filter="url(#shadow)">
    <rect x="85" y="112" width="730" height="108" rx="18" fill="#fff7ed" stroke="#e7a14b" stroke-width="2"/>
  </g>
  <rect x="111" y="136" width="100" height="28" rx="14" fill="#d47b22"/>
  <text x="161" y="155" text-anchor="middle" class="chip">INPUTS</text>
  <text x="500" y="158" text-anchor="middle" class="section">Imported evidence and operational records</text>
  <text x="450" y="190" text-anchor="middle" class="body">FD001 histories • fleet and component records • tasks • parts • deliveries</text>

  <path d="M450 222V252" class="line"/>

  <!-- Web workspace -->
  <g filter="url(#shadow)">
    <rect x="85" y="258" width="730" height="112" rx="18" fill="#eaf4fb" stroke="#76acd2" stroke-width="2"/>
  </g>
  <rect x="111" y="282" width="130" height="28" rx="14" fill="#267caf"/>
  <text x="176" y="301" text-anchor="middle" class="chip">USER LAYER</text>
  <text x="510" y="304" text-anchor="middle" class="section">React + TypeScript maintenance workspace</text>
  <text x="450" y="338" text-anchor="middle" class="body">3D inspection • evidence • alerts • planning • inventory • scenarios</text>

  <path d="M450 372V402" class="line"/>

  <!-- API boundary -->
  <g filter="url(#shadow)">
    <rect x="85" y="408" width="730" height="104" rx="18" fill="#f1effb" stroke="#9789c9" stroke-width="2"/>
  </g>
  <rect x="111" y="432" width="134" height="28" rx="14" fill="#6756a3"/>
  <text x="178" y="451" text-anchor="middle" class="chip">API LAYER</text>
  <text x="478" y="453" text-anchor="middle" class="section">Nginx reverse proxy + FastAPI</text>
  <text x="450" y="484" text-anchor="middle" class="body">Sessions • role permissions • CSRF protection • REST API • SSE updates</text>

  <path d="M450 514V545" class="line"/>

  <!-- Decision services -->
  <rect x="45" y="552" width="810" height="214" rx="22" fill="#eef4f8" stroke="#9bb2c4" stroke-width="2"/>
  <text x="450" y="585" text-anchor="middle" class="section">Decision services</text>

  <rect x="69" y="608" width="238" height="130" rx="16" fill="#fff" stroke="#dda15c" stroke-width="2"/>
  <text x="188" y="643" text-anchor="middle" class="cardTitle">Health assessment</text>
  <text x="188" y="676" text-anchor="middle" class="cardBody">Validate evidence</text>
  <text x="188" y="699" text-anchor="middle" class="cardBody">RUL in cycles + interval</text>
  <text x="188" y="722" text-anchor="middle" class="cardBody">Withhold if unsupported</text>

  <rect x="331" y="608" width="238" height="130" rx="16" fill="#fff" stroke="#67a4ca" stroke-width="2"/>
  <text x="450" y="643" text-anchor="middle" class="cardTitle">Constrained planner</text>
  <text x="450" y="676" text-anchor="middle" class="cardBody">OR-Tools CP-SAT</text>
  <text x="450" y="699" text-anchor="middle" class="cardBody">Tasks • parts • deliveries</text>
  <text x="450" y="722" text-anchor="middle" class="cardBody">Qualified crew • bay • deadlines</text>

  <rect x="593" y="608" width="238" height="130" rx="16" fill="#fff" stroke="#65ac91" stroke-width="2"/>
  <text x="712" y="643" text-anchor="middle" class="cardTitle">Fleet simulation</text>
  <text x="712" y="676" text-anchor="middle" class="cardBody">Deterministic SimPy scenarios</text>
  <text x="712" y="699" text-anchor="middle" class="cardBody">Availability • downtime</text>
  <text x="712" y="722" text-anchor="middle" class="cardBody">Part wait • bay wait</text>

  <path d="M450 768V798" class="line"/>

  <!-- Durable calculation rail -->
  <g filter="url(#shadow)">
    <rect x="85" y="804" width="730" height="102" rx="18" fill="#f6f3fb" stroke="#9c8aca" stroke-width="2"/>
  </g>
  <text x="450" y="834" text-anchor="middle" class="cardTitle">Durable calculation jobs</text>
  <rect x="117" y="852" width="140" height="33" rx="9" fill="#6a59a4"/>
  <text x="187" y="874" text-anchor="middle" class="chip">Job + outbox</text>
  <path d="M260 868H309" class="line"/>
  <rect x="316" y="852" width="122" height="33" rx="9" fill="#6a59a4"/>
  <text x="377" y="874" text-anchor="middle" class="chip">RabbitMQ</text>
  <path d="M441 868H490" class="line"/>
  <rect x="497" y="852" width="168" height="33" rx="9" fill="#6a59a4"/>
  <text x="581" y="874" text-anchor="middle" class="chip">Celery workers</text>
  <text x="730" y="873" text-anchor="middle" class="small">retry + cancel</text>

  <path d="M450 908V938" class="line"/>

  <!-- Storage -->
  <rect x="85" y="944" width="350" height="84" rx="16" fill="#eaf4fb" stroke="#76acd2" stroke-width="2"/>
  <text x="260" y="977" text-anchor="middle" class="cardTitle">PostgreSQL</text>
  <text x="260" y="1004" text-anchor="middle" class="cardBody">Records • jobs • reservations • audit</text>
  <rect x="465" y="944" width="350" height="84" rx="16" fill="#fff7ed" stroke="#e7a14b" stroke-width="2"/>
  <text x="640" y="977" text-anchor="middle" class="cardTitle">Artifact storage</text>
  <text x="640" y="1004" text-anchor="middle" class="cardBody">Hash-verified model • transform • calibration</text>

  <path d="M450 1030V1051" class="line"/>

  <!-- Human outcome -->
  <rect x="85" y="1057" width="730" height="48" rx="14" fill="#e8f5ef" stroke="#65ac91" stroke-width="2"/>
  <text x="450" y="1088" text-anchor="middle" class="cardTitle">Planner review → Supervisor approval → Recheck + reserve → Audit</text>
</svg>
