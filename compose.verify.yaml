# Isolated local verification only. Never shares live DB/artifact volumes or broker.
name: fleet-release-verify
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: fleet, POSTGRES_USER: fleet, POSTGRES_PASSWORD: fleet}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fleet -d fleet]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [verify-postgres:/var/lib/postgresql/data]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment: {RABBITMQ_DEFAULT_USER: fleet, RABBITMQ_DEFAULT_PASS: fleet}
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 5s
      retries: 30
  api:
    image: ${FLEET_VERIFY_API_IMAGE:-fleet-maintenance-api:latest}
    environment: &environment
      FLEET_DATABASE_URL: postgresql+psycopg://fleet:fleet@postgres:5432/fleet
      FLEET_BROKER_URL: amqp://fleet:fleet@rabbitmq:5672//
      FLEET_ARTIFACT_ROOT: /var/lib/fleet-maintenance/artifacts
      FLEET_JOB_LEASE_SECONDS: '30'
    command: [sh, -c, 'alembic upgrade head && uvicorn fleet_maintenance.main:app --host 0.0.0.0 --port 8000']
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    ports: ['127.0.0.1:${FLEET_VERIFY_API_PORT:-18000}:8000']
    volumes: [verify-artifacts:/var/lib/fleet-maintenance/artifacts]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    image: ${FLEET_VERIFY_API_IMAGE:-fleet-maintenance-worker:latest}
    environment: *environment
    command: [celery, -A, fleet_maintenance.workers.celery_app:app, worker, --loglevel=INFO, --concurrency=1, --without-mingle, --without-gossip]
    depends_on:
      api: {condition: service_healthy}
    volumes: [verify-artifacts:/var/lib/fleet-maintenance/artifacts]
  outbox:
    image: ${FLEET_VERIFY_API_IMAGE:-fleet-maintenance-outbox:latest}
    environment: *environment
    command: [python, -m, fleet_maintenance.workers.outbox_dispatcher]
    depends_on:
      api: {condition: service_healthy}
  web:
    image: ${FLEET_VERIFY_WEB_IMAGE:-fleet-maintenance-web:latest}
    depends_on:
      api: {condition: service_healthy}
    ports: ['127.0.0.1:${FLEET_VERIFY_WEB_PORT:-18080}:80']
volumes:
  verify-postgres:
  verify-artifacts:
