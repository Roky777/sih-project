name: fleet-maintenance

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fleet
      RABBITMQ_DEFAULT_PASS: fleet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "15672:15672"

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      FLEET_DATABASE_URL: postgresql+psycopg://fleet:fleet@postgres:5432/fleet
      FLEET_BROKER_URL: amqp://fleet:fleet@rabbitmq:5672//
      FLEET_ARTIFACT_ROOT: /var/lib/fleet-maintenance/artifacts
      # AI Maintenance Copilot: Ollama on the host machine (server-side only).
      FLEET_ASSISTANT_ENABLED: ${FLEET_ASSISTANT_ENABLED:-true}
      FLEET_ASSISTANT_OLLAMA_URL: ${FLEET_ASSISTANT_OLLAMA_URL:-http://host.docker.internal:11434}
      FLEET_ASSISTANT_MODEL: ${FLEET_ASSISTANT_MODEL:-qwen3:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "alembic upgrade head && uvicorn fleet_maintenance.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8000:8000"
    volumes:
      - artifact-data:/var/lib/fleet-maintenance/artifacts

  worker:
    build:
      context: ./backend
      target: runtime
    environment:
      FLEET_DATABASE_URL: postgresql+psycopg://fleet:fleet@postgres:5432/fleet
      FLEET_BROKER_URL: amqp://fleet:fleet@rabbitmq:5672//
      FLEET_ARTIFACT_ROOT: /var/lib/fleet-maintenance/artifacts
    command: ["celery", "-A", "fleet_maintenance.workers.celery_app:app", "worker", "--loglevel=INFO", "--without-mingle", "--without-gossip"]
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes:
      - artifact-data:/var/lib/fleet-maintenance/artifacts

  outbox:
    build:
      context: ./backend
      target: runtime
    environment:
      FLEET_DATABASE_URL: postgresql+psycopg://fleet:fleet@postgres:5432/fleet
      FLEET_BROKER_URL: amqp://fleet:fleet@rabbitmq:5672//
    command: ["python", "-m", "fleet_maintenance.workers.outbox_dispatcher"]
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8080:80"

volumes:
  postgres-data:
  artifact-data:
