map $request_method $login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $login_key zone=login:10m rate=30r/m;

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    set $fleet_upstream http://api:8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;
    # Reduce cold-load bytes for scripts, charts, JSON and local aircraft models.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml application/octet-stream model/gltf-binary;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /api/access/session {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $fleet_upstream;
        proxy_set_header Host $host;
    }

    location /api/events {
        proxy_pass $fleet_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
    }

    # The copilot waits for the local model, which can take longer than the default 60 s.
    location /api/assistant/chat {
        proxy_pass $fleet_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass $fleet_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed build output can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # The HTML entry point (and other unhashed files) must be revalidated, otherwise browsers keep
    # an old index.html that points at outdated asset bundles. `expires` is used instead of
    # add_header so the server-level security headers are still inherited.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
